services:
 web:
  build: .
  entrypoint: /bin/bash
  ports:
   - "8001:8000"
  links:
   - postgres
   - redis
  tty: true
  stdin_open: true
  working_dir: /proj/
  user: test
  volumes:
   - ./:/proj/
   - ./pyenv:/home/test
 celery:
  build: .
  entrypoint: sh -c "pip install -e /proj && pip install redis && celery -A project.celery worker -l info"
  depends_on:
   - postgres
   - redis
  tty: true
  stdin_open: true
  working_dir: /proj/example
  user: test
  volumes:
   - ./:/proj/
   - ./pyenv:/home/test
 redis:
  image: redis
 postgres:
  image: postgres:14-alpine
  ports:
   - "5432:5432"
  volumes:
   - ./db:/var/lib/postgresql/data
  environment:
   POSTGRES_PASSWORD: foobar
   POSTGRES_USER: pguser
   PGDATA: /var/lib/postgresql/data
   POSTGRES_HOST_AUTH_METHOD: md5
