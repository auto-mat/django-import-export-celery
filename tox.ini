[tox]
envlist =
    py{39,310,311,312,313}-django42
    py{310,311,312,313}-django50
    py{310,311,312,313}-django51
    py{311,312,313}-django52

[testenv]
package = sdist
deps =
    -rrequirements_test.txt
    coverage
    django-coverage-plugin
    django42: django>=4.2,<4.3
    django50: django>=5.0,<5.1
    django51: django>=5.1,<5.2
    django52: django>=5.2,<5.3

setenv =
    DATABASE_TYPE=sqlite
    REDIS_URL=redis://127.0.0.1:6379/0

allowlist_externals = coverage

test-executable =
    python --version
    python -c "import django; print(django.get_version())"
    pip install -r requirements_test.txt
    {envbindir}/python -Wall {envbindir}/coverage run --append

commands =
    python example/manage.py migrate
    {[testenv]test-executable} example/manage.py test winners
    coverage report
    coverage xml -o coverage.xml
